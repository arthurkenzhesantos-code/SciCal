<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Professional scientific calculator">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PRECISION TOOL</p>
        <h1>Scientific Calculator</h1>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">☾</button>
    </header>

    <section class="calculator" aria-label="Scientific calculator">
      <div class="display">
        <div class="display-meta">
          <span id="angleMode">DEG</span>
          <span id="memoryIndicator" class="hidden">M</span>
          <button id="copyBtn" class="copy-btn" type="button">Copy</button>
        </div>
        <div id="expression" class="expression" aria-label="Expression"></div>
        <output id="result" class="result" aria-live="polite">0</output>
        <div id="error" class="error" aria-live="polite"></div>
      </div>

      <div class="toolbar">
        <button class="mode-btn active" data-mode="scientific" type="button">Scientific</button>
        <button class="mode-btn" data-mode="basic" type="button">Basic</button>
        <button id="angleBtn" type="button">DEG</button>
        <button id="clearHistoryBtn" type="button">Clear history</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key function" data-action="memory-clear" type="button">MC</button>
        <button class="key function" data-action="memory-recall" type="button">MR</button>
        <button class="key function" data-action="memory-add" type="button">M+</button>
        <button class="key function" data-action="memory-subtract" type="button">M−</button>
        <button class="key danger" data-action="clear" type="button">AC</button>

        <button class="key function scientific-only" data-insert="(" type="button">(</button>
        <button class="key function scientific-only" data-insert=")" type="button">)</button>
        <button class="key function scientific-only" data-action="backspace" type="button">⌫</button>
        <button class="key function scientific-only" data-insert="!" type="button">x!</button>
        <button class="key operator" data-insert="/" type="button">÷</button>

        <button class="key function scientific-only" data-action="sin" type="button">sin</button>
        <button class="key function scientific-only" data-action="cos" type="button">cos</button>
        <button class="key function scientific-only" data-action="tan" type="button">tan</button>
        <button class="key function scientific-only" data-action="sqrt" type="button">√</button>
        <button class="key operator" data-insert="*" type="button">×</button>

        <button class="key function scientific-only" data-action="asin" type="button">sin⁻¹</button>
        <button class="key function scientific-only" data-action="acos" type="button">cos⁻¹</button>
        <button class="key function scientific-only" data-action="atan" type="button">tan⁻¹</button>
        <button class="key function scientific-only" data-action="square" type="button">x²</button>
        <button class="key operator" data-insert="-" type="button">−</button>

        <button class="key function scientific-only" data-action="log" type="button">log</button>
        <button class="key function scientific-only" data-action="ln" type="button">ln</button>
        <button class="key function scientific-only" data-action="pi" type="button">π</button>
        <button class="key function scientific-only" data-action="e" type="button">e</button>
        <button class="key operator" data-insert="+" type="button">+</button>

        <button class="key number" data-insert="7" type="button">7</button>
        <button class="key number" data-insert="8" type="button">8</button>
        <button class="key number" data-insert="9" type="button">9</button>
        <button class="key function scientific-only" data-action="percent" type="button">%</button>
        <button class="key equals" data-action="equals" type="button">=</button>

        <button class="key number" data-insert="4" type="button">4</button>
        <button class="key number" data-insert="5" type="button">5</button>
        <button class="key number" data-insert="6" type="button">6</button>
        <button class="key function scientific-only" data-action="reciprocal" type="button">1/x</button>
        <button class="key equals-placeholder" aria-hidden="true" tabindex="-1" type="button"></button>

        <button class="key number" data-insert="1" type="button">1</button>
        <button class="key number" data-insert="2" type="button">2</button>
        <button class="key number" data-insert="3" type="button">3</button>
        <button class="key function scientific-only" data-action="negate" type="button">±</button>
        <button class="key equals-placeholder" aria-hidden="true" tabindex="-1" type="button"></button>

        <button class="key number zero" data-insert="0" type="button">0</button>
        <button class="key number" data-insert="." type="button">.</button>
        <button class="key function scientific-only" data-action="ans" type="button">ANS</button>
        <button class="key equals-placeholder" aria-hidden="true" tabindex="-1" type="button"></button>
        <button class="key equals-placeholder" aria-hidden="true" tabindex="-1" type="button"></button>
      </div>

      <section class="history-panel">
        <div class="history-heading">
          <h2>History</h2>
          <span id="historyCount">0</span>
        </div>
        <div id="history" class="history-list">
          <p class="empty-history">Your calculations will appear here.</p>
        </div>
      </section>
    </section>
  </main>
  <script src="js/functions.js"></script>
  <script src="js/history.js"></script>
  <script src="js/calculator.js"></script>
</body>
</html>
